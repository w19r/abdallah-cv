<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>w19r.org</title>
  
  <!-- تحويل تلقائي بعد 5 ثوانٍ -->
  <meta http-equiv="refresh" content="5;url=https://www.abdallahalaydi.com">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0e12;
      color: #e6edf3;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: #161b22;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 30px 25px;
    }

    h1 {
      font-size: 1.1em;
      font-weight: 600;
      color: #d4af37;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.9em;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .en-text {
      direction: ltr;
      font-size: 0.85em;
      color: #6e7681;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 10px 0;
      font-size: 0.9em;
      font-weight: 600;
      color: #0d0e12;
      background: #d4af37;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
      margin-bottom: 20px;
    }

    .btn:hover {
      background: #f3e5ab;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 0.8em;
    }

    .social a {
      color: #8b949e;
      text-decoration: none;
    }

    .social a:hover {
      color: #d4af37;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>تم نقل الموقع</h1>
    <p>تم انتقال الموقع رسمياً إلى الدومين الجديد</p>
    <p class="en-text">The website has been moved to our new domain</p>

    <a href="https://www.abdallahalaydi.com" class="btn">www.abdallahalaydi.com</a>

    <div class="social">
      <a href="https://www.instagram.com/1w19r?igsh=MnJwZWpscHRtMGJx&utm_source=qr" target="_blank">Instagram</a>
      <span>|</span>
      <a href="https://tiktok.com/@w19r" target="_blank">TikTok</a>
    </div>
  </div>

</body>
</html>
